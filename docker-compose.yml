# Milvus + Elasticsearch 向量化 & BM25 检索
# 加入到已有的 product_db_youlai-net 网络
version: "3.8"

services:
  # ============================================
  # Elasticsearch (单节点，BM25全文检索)
  # ============================================
  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: product-es-ik:8.17.1
    container_name: product-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - youlai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ============================================
  # Etcd (Milvus 依赖)
  # ============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: product-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    networks:
      - youlai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ============================================
  # MinIO (Milvus 对象存储)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: product-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    ports:
      - "9001:9001"
    networks:
      - youlai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ============================================
  # Milvus Standalone (向量检索)
  # ============================================
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: product-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - youlai-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  youlai-net:
    name: product_db_youlai-net
    external: true

volumes:
  es-data:
    name: product_es_data
  etcd-data:
    name: product_etcd_data
  minio-data:
    name: product_minio_data
  milvus-data:
    name: product_milvus_data
