[alembic]
# migration scripts directory
script_location = alembic

# revision id filename template
file_template = %%(rev)s_%%(slug)s

# prepend sys.path so imports work
prepend_sys_path = .

# version table name (default: alembic_version)
# version_table = alembic_version

# output to file (offline mode)
output_mode = file

# timestamp comparison
timezone = UTC

# sqlalchemy.url is set dynamically in env.py from app.config.settings
# no hard-coded DSN here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
